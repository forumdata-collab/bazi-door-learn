<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" font-family="'Noto Sans TC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#c89b3c"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#d86060"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="500" height="420" rx="16" fill="#1a1520"/>
  <text x="250" y="35" text-anchor="middle" fill="#ffd700" font-size="18" font-weight="bold">五行生剋圖</text>
  <!-- Nodes -->
  <circle cx="250" cy="90" r="38" fill="#2a5a2a" stroke="#4a9a4a" stroke-width="2"/><text x="250" y="96" text-anchor="middle" fill="#7cda7c" font-size="22" font-weight="bold">木</text>
  <circle cx="400" cy="200" r="38" fill="#5a2a1a" stroke="#da6a3a" stroke-width="2"/><text x="400" y="206" text-anchor="middle" fill="#ff9a6a" font-size="22" font-weight="bold">火</text>
  <circle cx="350" cy="340" r="38" fill="#5a4a2a" stroke="#c89b3c" stroke-width="2"/><text x="350" y="346" text-anchor="middle" fill="#ffd700" font-size="22" font-weight="bold">土</text>
  <circle cx="150" cy="340" r="38" fill="#4a4a5a" stroke="#aaaacc" stroke-width="2"/><text x="150" y="346" text-anchor="middle" fill="#ccccff" font-size="22" font-weight="bold">金</text>
  <circle cx="100" cy="200" r="38" fill="#1a2a4a" stroke="#4a7acc" stroke-width="2"/><text x="100" y="206" text-anchor="middle" fill="#7abaff" font-size="22" font-weight="bold">水</text>
  <!-- 生 arrows (gold, curved) -->
  <path d="M275,125 Q340,130 378,172" fill="none" stroke="#c89b3c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="340" y="138" fill="#c89b3c" font-size="12">生</text>
  <path d="M410,238 Q400,280 372,315" fill="none" stroke="#c89b3c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="408" y="278" fill="#c89b3c" font-size="12">生</text>
  <path d="M315,348 Q260,380 185,348" fill="none" stroke="#c89b3c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="250" y="382" fill="#c89b3c" font-size="12">生</text>
  <path d="M130,310 Q105,270 105,240" fill="none" stroke="#c89b3c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="82" y="278" fill="#c89b3c" font-size="12">生</text>
  <path d="M120,168 Q150,130 220,100" fill="none" stroke="#c89b3c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="140" y="128" fill="#c89b3c" font-size="12">生</text>
  <!-- 剋 arrows (red, star pattern) -->
  <line x1="250" y1="128" x2="335" y2="315" stroke="#d86060" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
  <line x1="375" y1="325" x2="120" y2="215" stroke="#d86060" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
  <line x1="100" y1="238" x2="235" y2="90" stroke="#d86060" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
  <line x1="265" y1="128" x2="165" y2="315" stroke="#d86060" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
  <line x1="120" y1="175" x2="365" y2="330" stroke="#d86060" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
  <!-- Legend -->
  <line x1="180" y1="400" x2="210" y2="400" stroke="#c89b3c" stroke-width="2.5"/><text x="215" y="404" fill="#b8a88a" font-size="11">相生（順生）</text>
  <line x1="300" y1="400" x2="330" y2="400" stroke="#d86060" stroke-width="1.8" stroke-dasharray="5,4"/><text x="335" y="404" fill="#b8a88a" font-size="11">相剋（隔一剋）</text>
</svg>
