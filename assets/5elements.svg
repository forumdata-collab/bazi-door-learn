<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Noto Sans TC',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1830"/><stop offset="100%" stop-color="#14121c"/>
    </linearGradient>
    <radialGradient id="woodG" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#3a8a3a"/><stop offset="100%" stop-color="#1e4a1e"/></radialGradient>
    <radialGradient id="fireG" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#ff8a4a"/><stop offset="100%" stop-color="#8a3010"/></radialGradient>
    <radialGradient id="earthG" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#e0b050"/><stop offset="100%" stop-color="#7a5a10"/></radialGradient>
    <radialGradient id="metalG" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#d0d0e8"/><stop offset="100%" stop-color="#5a5a7a"/></radialGradient>
    <radialGradient id="waterG" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#50a0e0"/><stop offset="100%" stop-color="#103060"/></radialGradient>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#c8a050"/></marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#e06050"/></marker>
    <filter id="softShadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="520" height="460" rx="18" fill="url(#bgGrad)" stroke="#3a3040" stroke-width="1"/>
  <text x="260" y="38" text-anchor="middle" fill="#ffd700" font-size="19" font-weight="bold">五行生剋關係圖</text>
  <text x="260" y="60" text-anchor="middle" fill="#887a6a" font-size="12">實線＝相生（順生循環）・虛線＝相剋（隔位制衡）</text>
  <!-- Element nodes -->
  <g filter="url(#softShadow)">
    <circle cx="260" cy="105" r="42" fill="url(#woodG)" stroke="#6aba6a" stroke-width="2"/><text x="260" y="112" text-anchor="middle" fill="#d8ffd8" font-size="26" font-weight="bold">木</text>
    <circle cx="420" cy="215" r="42" fill="url(#fireG)" stroke="#ff9a5a" stroke-width="2"/><text x="420" y="222" text-anchor="middle" fill="#ffe0c8" font-size="26" font-weight="bold">火</text>
    <circle cx="350" cy="355" r="42" fill="url(#earthG)" stroke="#e0c060" stroke-width="2"/><text x="350" y="362" text-anchor="middle" fill="#3a2a00" font-size="26" font-weight="bold">土</text>
    <circle cx="170" cy="355" r="42" fill="url(#metalG)" stroke="#c0c0d8" stroke-width="2"/><text x="170" y="362" text-anchor="middle" fill="#2a2a3a" font-size="26" font-weight="bold">金</text>
    <circle cx="100" cy="215" r="42" fill="url(#waterG)" stroke="#70b8f0" stroke-width="2"/><text x="100" y="222" text-anchor="middle" fill="#d8f0ff" font-size="26" font-weight="bold">水</text>
  </g>
  <!-- 生 arrows (gold solid, animated) -->
  <path d="M288,130 Q355,138 392,180" fill="none" stroke="#c8a050" stroke-width="2.5" marker-end="url(#arrowG)" class="flow-arrow"/>
  <text x="352" y="142" text-anchor="middle" fill="#c8a050" font-size="11">生</text>
  <path d="M428,257 Q418,295 390,322" fill="none" stroke="#c8a050" stroke-width="2.5" marker-end="url(#arrowG)" class="flow-arrow"/>
  <text x="428" y="290" text-anchor="middle" fill="#c8a050" font-size="11">生</text>
  <path d="M318,375 Q260,405 205,375" fill="none" stroke="#c8a050" stroke-width="2.5" marker-end="url(#arrowG)" class="flow-arrow"/>
  <text x="260" y="410" text-anchor="middle" fill="#c8a050" font-size="11">生</text>
  <path d="M145,322 Q120,290 108,255" fill="none" stroke="#c8a050" stroke-width="2.5" marker-end="url(#arrowG)" class="flow-arrow"/>
  <text x="98" y="295" text-anchor="middle" fill="#c8a050" font-size="11">生</text>
  <path d="M132,190 Q160,145 230,115" fill="none" stroke="#c8a050" stroke-width="2.5" marker-end="url(#arrowG)" class="flow-arrow"/>
  <text x="150" y="140" text-anchor="middle" fill="#c8a050" font-size="11">生</text>
  <!-- 剋 arrows (red dashed) -->
  <line x1="265" y1="147" x2="335" y2="330" stroke="#e06050" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowR)" class="flow-arrow2"/>
  <line x1="390" y1="340" x2="135" y2="235" stroke="#e06050" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowR)" class="flow-arrow2"/>
  <line x1="100" y1="255" x2="240" y2="110" stroke="#e06050" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowR)" class="flow-arrow2"/>
  <line x1="275" y1="145" x2="185" y2="330" stroke="#e06050" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowR)" class="flow-arrow2"/>
  <line x1="125" y1="190" x2="375" y2="345" stroke="#e06050" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowR)" class="flow-arrow2"/>
  <!-- Legend -->
  <g>
    <rect x="70" y="425" width="140" height="24" rx="12" fill="#1a1520" stroke="#3a3040"/>
    <line x1="82" y1="437" x2="108" y2="437" stroke="#c8a050" stroke-width="2.5"/>
    <text x="115" y="441" fill="#b8a88a" font-size="11">相生（順）</text>
    <rect x="310" y="425" width="140" height="24" rx="12" fill="#1a1520" stroke="#3a3040"/>
    <line x1="322" y1="437" x2="348" y2="437" stroke="#e06050" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="355" y="441" fill="#b8a88a" font-size="11">相剋（隔）</text>
  </g>
</svg>
