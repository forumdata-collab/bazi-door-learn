<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="'Noto Sans TC',sans-serif">
  <rect width="600" height="450" rx="16" fill="#1a1520"/>
  <text x="300" y="35" text-anchor="middle" fill="#ffd700" font-size="18" font-weight="bold">十神關係圖（以日主為中心）</text>
  <!-- Central circle -->
  <circle cx="300" cy="230" r="50" fill="#3d2f50" stroke="#ffd700" stroke-width="3"/><text x="300" y="225" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold">日主</text><text x="300" y="245" text-anchor="middle" fill="#d8a0f0" font-size="12">（我）</text>
  <!-- 5 relationships, positioned around -->
  <!-- 生我 (印) - top -->
  <rect x="245" y="50" width="110" height="55" rx="10" fill="#2d3a2d" stroke="#4a9a4a" stroke-width="1.5"/>
  <text x="300" y="72" text-anchor="middle" fill="#7cba5a" font-size="14" font-weight="bold">生我 → 印星</text>
  <text x="300" y="92" text-anchor="middle" fill="#a0c080" font-size="11">正印・偏印</text>
  <line x1="300" y1="105" x2="300" y2="180" stroke="#4a9a4a" stroke-width="2" marker-end="url(#arr-g)"/>
  <defs><marker id="arr-g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#4a9a4a"/></marker></defs>
  <!-- 我生 (食傷) - bottom -->
  <rect x="230" y="370" width="140" height="55" rx="10" fill="#2a2438" stroke="#8a6ad0" stroke-width="1.5"/>
  <text x="300" y="392" text-anchor="middle" fill="#b89ae0" font-size="14" font-weight="bold">我生 → 食傷</text>
  <text x="300" y="412" text-anchor="middle" fill="#a090c0" font-size="11">食神・傷官</text>
  <defs><marker id="arr-p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#8a6ad0"/></marker></defs>
  <line x1="300" y1="280" x2="300" y2="368" stroke="#8a6ad0" stroke-width="2" marker-end="url(#arr-p)"/>
  <!-- 剋我 (官殺) - left -->
  <rect x="30" y="200" width="110" height="55" rx="10" fill="#3a2020" stroke="#d86060" stroke-width="1.5"/>
  <text x="85" y="222" text-anchor="middle" fill="#d88080" font-size="14" font-weight="bold">剋我 → 官殺</text>
  <text x="85" y="242" text-anchor="middle" fill="#c09090" font-size="11">正官・七殺</text>
  <defs><marker id="arr-r" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#d86060"/></marker></defs>
  <line x1="140" y1="230" x2="248" y2="230" stroke="#d86060" stroke-width="2" marker-end="url(#arr-r)"/>
  <!-- 我剋 (財才) - right -->
  <rect x="460" y="200" width="110" height="55" rx="10" fill="#5a4a2a" stroke="#c89b3c" stroke-width="1.5"/>
  <text x="515" y="222" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold">我剋 → 財星</text>
  <text x="515" y="242" text-anchor="middle" fill="#c8b88a" font-size="11">正財・偏財</text>
  <line x1="352" y1="230" x2="458" y2="230" stroke="#c89b3c" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 同我 (比劫) - top-right -->
  <rect x="420" y="80" width="110" height="55" rx="10" fill="#2a2040" stroke="#9a80d0" stroke-width="1.5"/>
  <text x="475" y="102" text-anchor="middle" fill="#b8a0e0" font-size="14" font-weight="bold">同我 → 比劫</text>
  <text x="475" y="122" text-anchor="middle" fill="#a090c0" font-size="11">比肩・劫財</text>
  <defs><marker id="arr-b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#9a80d0"/></marker></defs>
  <path d="M345,180 Q390,130 418,108" fill="none" stroke="#9a80d0" stroke-width="2" marker-end="url(#arr-b)"/>
</svg>
