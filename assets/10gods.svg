<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Noto Sans TC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e1830"/><stop offset="100%" stop-color="#14121c"/></linearGradient>
    <radialGradient id="centerG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4a3a6a"/><stop offset="100%" stop-color="#2a1f3d"/></radialGradient>
    <filter id="ds"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="620" height="460" rx="18" fill="url(#bg)" stroke="#3a3040" stroke-width="1"/>
  <text x="310" y="38" text-anchor="middle" fill="#ffd700" font-size="19" font-weight="bold">十神關係圖（以日主為中心）</text>
  <!-- Center: 日主 -->
  <circle cx="310" cy="235" r="48" fill="url(#centerG)" stroke="#ffd700" stroke-width="3" filter="url(#ds)"/>
  <text x="310" y="228" text-anchor="middle" fill="#ffd700" font-size="17" font-weight="bold">日主</text>
  <text x="310" y="248" text-anchor="middle" fill="#b89ae0" font-size="11">（我）</text>
  <!-- 生我 → 印星 (top) -->
  <g filter="url(#ds)">
    <rect x="240" y="52" width="140" height="52" rx="12" fill="#1e3a1e" stroke="#4a8a3a" stroke-width="1.5"/>
    <text x="310" y="74" text-anchor="middle" fill="#7cba5a" font-size="15" font-weight="bold">生我 → 印星</text>
    <text x="310" y="92" text-anchor="middle" fill="#a0c080" font-size="10">正印・偏印</text>
  </g>
  <line x1="310" y1="104" x2="310" y2="187" stroke="#4a8a3a" stroke-width="2" marker-end="url(#arrowG)" class="flow-arrow"/>
  <!-- 我生 → 食傷 (bottom) -->
  <g filter="url(#ds)">
    <rect x="230" y="392" width="160" height="52" rx="12" fill="#2a1a3a" stroke="#7a5ac0" stroke-width="1.5"/>
    <text x="310" y="414" text-anchor="middle" fill="#a080e0" font-size="15" font-weight="bold">我生 → 食傷</text>
    <text x="310" y="432" text-anchor="middle" fill="#8870b0" font-size="10">食神・傷官</text>
  </g>
  <line x1="310" y1="283" x2="310" y2="390" stroke="#7a5ac0" stroke-width="2" marker-end="url(#arrowG)"/>
  <!-- 剋我 → 官殺 (left) -->
  <g filter="url(#ds)">
    <rect x="20" y="208" width="130" height="52" rx="12" fill="#3a1a1a" stroke="#c05050" stroke-width="1.5"/>
    <text x="85" y="230" text-anchor="middle" fill="#e07070" font-size="15" font-weight="bold">剋我 → 官殺</text>
    <text x="85" y="248" text-anchor="middle" fill="#c08080" font-size="10">正官・七殺</text>
  </g>
  <line x1="150" y1="235" x2="260" y2="235" stroke="#c05050" stroke-width="2" marker-end="url(#arrowR)"/>
  <!-- 我剋 → 財星 (right) -->
  <g filter="url(#ds)">
    <rect x="470" y="208" width="130" height="52" rx="12" fill="#3a3018" stroke="#c8a040" stroke-width="1.5"/>
    <text x="535" y="230" text-anchor="middle" fill="#ffd700" font-size="15" font-weight="bold">我剋 → 財星</text>
    <text x="535" y="248" text-anchor="middle" fill="#c8b888" font-size="10">正財・偏財</text>
  </g>
  <line x1="358" y1="235" x2="468" y2="235" stroke="#c8a040" stroke-width="2" marker-end="url(#arrowG)"/>
  <!-- 同我 → 比劫 (top-right) -->
  <g filter="url(#ds)">
    <rect x="450" y="72" width="130" height="52" rx="12" fill="#1e1838" stroke="#8070b0" stroke-width="1.5"/>
    <text x="515" y="94" text-anchor="middle" fill="#a090d0" font-size="15" font-weight="bold">同我 → 比劫</text>
    <text x="515" y="112" text-anchor="middle" fill="#9080b0" font-size="10">比肩・劫財</text>
  </g>
  <path d="M340,192 Q400,135 448,98" fill="none" stroke="#8070b0" stroke-width="2" marker-end="url(#arrowG)"/>
  <!-- Relationship cycle labels -->
  <text x="195" y="170" text-anchor="middle" fill="#5a5070" font-size="10" transform="rotate(-50,195,170)">相生循環</text>
  <text x="420" y="320" text-anchor="middle" fill="#5a5070" font-size="10" transform="rotate(50,420,320)">相剋循環</text>
</svg>
